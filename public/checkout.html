
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopZone Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 15px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { cursor: pointer; }
    #message { color: #b00020; }
  </style>
</head>
<body>
  <h2>ShopZone Checkout</h2>

  <div id="cartSummary"></div>
  <h3 id="total"></h3>

  <form id="checkoutForm">
    <input id="customerName" placeholder="Full Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="phone" type="tel" placeholder="Phone Number" required>
    <textarea id="address" placeholder="Full Address" required></textarea>

    <button type="submit" id="codButton">Place COD Order</button>
    <button type="button" id="onlineButton">Pay Online with Razorpay</button>
  </form>

  <p id="message"></p>

  <script>
    const token = localStorage.getItem("token");
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");

    const message = document.getElementById("message");
    const codButton = document.getElementById("codButton");
    const onlineButton = document.getElementById("onlineButton");

    function showMessage(text) {
      message.textContent = text;
    }

    function getCartItems() {
      return cart.map(item => ({
        productId: item.productId || item._id,
        quantity: Number(item.quantity)
      }));
    }

    function getCustomerDetails() {
      return {
        customerName: document.getElementById("customerName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim()
      };
    }

    function validateCheckout() {
      if (!token) {
        showMessage("Please log in first.");
        return false;
      }

      if (!cart.length) {
        showMessage("Your cart is empty.");
        return false;
      }

      if (!document.getElementById("checkoutForm").reportValidity()) {
        return false;
      }

      return true;
    }

    async function sendRequest(url, data) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || "Request failed");
      }

      return result;
    }

    function finishOrder(orderId) {
      localStorage.removeItem("cart");
      alert("Order successful! Order ID: " + orderId);
      window.location.href = "my-orders.html";
    }

    // Display cart summary only; final price comes from server
    const summary = document.getElementById("cartSummary");

    if (!cart.length) {
      summary.textContent = "Your cart is empty.";
    } else {
      cart.forEach(item => {
        const line = document.createElement("p");
        line.textContent =
          (item.name || item.title || "Product") +
          " × " + item.quantity;
        summary.appendChild(line);
      });
    }

    document.getElementById("total").textContent =
      "Final total will be calculated securely by the server.";

    // COD order
    document.getElementById("checkoutForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!validateCheckout()) return;

      codButton.disabled = true;
      onlineButton.disabled = true;
      showMessage("Placing COD order...");

      try {
        const result = await sendRequest("/api/orders", {
          ...getCustomerDetails(),
          items: getCartItems(),
          paymentMethod: "COD"
        });

        finishOrder(result._id);
      } catch (error) {
        showMessage(error.message);
        codButton.disabled = false;
        onlineButton.disabled = false;
      }
    });

    // Online order
    onlineButton.addEventListener("click", async () => {
      if (!validateCheckout()) return;

      if (typeof Razorpay === "undefined") {
        showMessage("Razorpay checkout could not load. Please try again.");
        return;
      }

      codButton.disabled = true;
      onlineButton.disabled = true;
      showMessage("Creating secure payment order...");

      try {
        const paymentData = await sendRequest("/api/payment/create-order", {
          ...getCustomerDetails(),
          items: getCartItems()
        });

        const options = {
          key: paymentData.keyId,
          amount: paymentData.order.amount,
          currency: paymentData.order.currency,
          name: "ShopZone",
          description: "Order payment",
          order_id: paymentData.order.id,

          handler: async function (paymentResponse) {
            showMessage("Verifying payment...");

            try {
              const verified = await sendRequest("/api/payment/verify", {
                ...paymentResponse
              });

              if (verified.success) {
                finishOrder(verified.orderId || paymentData.shopZoneOrderId);
              } else {
                showMessage("Payment could not be verified. Contact support before retrying.");
                codButton.disabled = false;
                onlineButton.disabled = false;
              }
            } catch (error) {
              showMessage(
                "Payment result needs checking. Do not pay again yet. " +
                error.message
              );
              codButton.disabled = false;
              onlineButton.disabled = false;
            }
          },

          modal: {
  ondismiss: async function () {
    try {
      const result = await sendRequest(
        "/api/payment/release-stock",
        {
          shopZoneOrderId: paymentData.shopZoneOrderId
        }
      );

      showMessage(
        "Payment window closed. " + result.message +
        ". Check My Orders before trying again."
      );
    } catch (error) {
      showMessage(
        "Payment window closed. " + error.message +
        ". Check My Orders before retrying."
      );
    } finally {
      codButton.disabled = false;
      onlineButton.disabled = false;
    }
  }
},

          prefill: {
            name: document.getElementById("customerName").value.trim(),
            email: document.getElementById("email").value.trim(),
            contact: document.getElementById("phone").value.trim()
          },

          theme: { color: "#2874f0" }
        };

        const checkout = new Razorpay(options);

        checkout.on("payment.failed", function () {
          showMessage(
            "Payment failed. Check your order status before trying again."
          );
          codButton.disabled = false;
          onlineButton.disabled = false;
        });

        checkout.open();
      } catch (error) {
        showMessage(error.message);
        codButton.disabled = false;
        onlineButton.disabled = false;
      }
    });
  </script>
</body>
</html>
